name: Node.js tests

on:
  push:
    branches:
      - feature/honeycoin-onramp-orders
      - feature/paytrie-platform-authorization-gate
  pull_request:
    branches:
      - feature/customer-routing-interface
      - feature/bridge-self-serve-onboarding
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --check services/routingService.js
      - run: node --check services/paytrieService.js
      - run: node --check services/paytrieExecutionService.js
      - run: node --check routes/paytrieRoutes.js
      - run: node --check services/paytrieOnboardingService.js
      - run: node --check services/paytrieWebhookService.js
      - run: node --check repositories/paytrieOnboardingRepository.js
      - run: node --check test/paytrieOnboarding.test.js
      - run: node --check public/paytrie-onboarding.js
      - run: node --check test/providerAdapters.test.js
      - name: Check Paytrie onboarding page script syntax
        run: node --check public/paytrie-onboarding.js
      - name: Check Paytrie transfer frontend script syntax
        run: node -e "const fs=require('node:fs'); const html=fs.readFileSync('public/transfer-flow.html','utf8'); const script=html.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/)?.[1]; if(!script) throw new Error('Transfer frontend script not found'); new Function('return (async()=>{'+script+'})');"
      - run: node --check services/providers/honeycoinService.js
      - run: node --check services/providerOrderService.js
      - run: node --check repositories/providerOrderRepository.js
      - run: node --check routes/transferRoutes.js
      - run: node --check db/initialize.js
      - name: Check Honeycoin frontend script syntax
        run: node --input-type=module -e "import fs from 'node:fs'; const html = fs.readFileSync('public/honeycoin-onramp.html', 'utf8'); const script = html.match(/<script>([\\s\\S]*?)<\\/script>/)?.[1]; if (!script) throw new Error('Frontend script not found'); new Function(script);"
      - run: npm test
